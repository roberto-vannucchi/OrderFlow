services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest@123
    ports:
      - "5672:5672"
      - "15672:15672"
  
  redis:
    image: redis:8.10-alpine
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:3.8
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

  loki:
    image: grafana/loki:3.7.8
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redisinsight_data:
  loki_data:
  grafana_data:
